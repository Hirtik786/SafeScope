name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# A release made in the GitHub UI can fire both events for one tag; run once.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Upload dist for the PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Create the release (or attach files if it was created in the GitHub UI)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --title "SafeScope $TAG"
          fi

  # Trusted Publishing (OIDC): no API token stored anywhere.
  # Needs a PyPI publisher (project safescope-scanner) for: owner Karim-Bazooka, repo SafeScope,
  # workflow release.yml, environment pypi.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/safescope-scanner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
