name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Tests with coverage gate
        run: pytest --cov=safescope --cov-report=term-missing --cov-fail-under=85

  package:
    name: wheel install in a clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - name: Install the wheel outside the source tree
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/safescope --version
          /tmp/clean/bin/safescope checks
          /tmp/clean/bin/python -c "from safescope.web import static_file; assert static_file('index.html').status == 200; assert static_file('app.js').status == 200"
      - name: Scan the demo server with the installed wheel
        run: |
          python examples/vulnerable_demo_server.py --port 8000 &
          sleep 1
          cd /tmp
          /tmp/clean/bin/safescope scan http://127.0.0.1:8000 --skip tls --no-color
          /tmp/clean/bin/safescope scan http://127.0.0.1:8000 --skip tls -f markdown >> "$GITHUB_STEP_SUMMARY"
          set +e
          /tmp/clean/bin/safescope scan http://127.0.0.1:8000 --skip tls --fail-on medium -q > /dev/null
          code=$?
          set -e
          test "$code" = "1"

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the demo server
        run: |
          python3 examples/vulnerable_demo_server.py --port 8000 &
          sleep 1
      - name: Run the action from this repository
        id: scan
        uses: ./
        with:
          target: http://127.0.0.1:8000
          fail-on: ""
          skip: tls
      - name: Check the action outputs
        env:
          GRADE: ${{ steps.scan.outputs.grade }}
          SCORE: ${{ steps.scan.outputs.score }}
        run: |
          echo "grade=$GRADE score=$SCORE"
          test "$GRADE" = "F"
          test -f safescope-report.html
          test -f safescope-report.json
