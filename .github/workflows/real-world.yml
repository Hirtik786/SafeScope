name: Real-world scans

# Scans real public websites to make sure SafeScope works outside the lab.
# Targets are badssl.com (built for testing TLS tools) and large public sites.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly, catches changes on the internet side
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Real-world test suite
        # Real websites occasionally time out; one rerun of failed tests only.
        run: pytest -m network --run-network -v || pytest -m network --run-network -v --last-failed

  cli-scans:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - github.com
          - www.wikipedia.org
          - expired.badssl.com
          - self-signed.badssl.com
          - hsts.badssl.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Scan ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Real websites occasionally time out; retry once before failing.
          safescope scan "$TARGET" --no-color || { sleep 10; safescope scan "$TARGET" --no-color; }
          safescope scan "$TARGET" -f markdown >> "$GITHUB_STEP_SUMMARY"
          safescope scan "$TARGET" -f json -o result.json -q || { sleep 10; safescope scan "$TARGET" -f json -o result.json -q; }
          python -c "import json; d=json.load(open('result.json')); errs=[f for f in d['findings'] if f['status']=='error']; assert not errs, errs; print('grade', d['grade'])"

  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Start the web app and scan through its API
        run: |
          safescope serve --port 8000 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/ | grep -q "SafeScope"
          curl -fsS "http://127.0.0.1:8000/api/scan?target=github.com" | python -c "import json,sys; d=json.load(sys.stdin); print('github.com grade', d['grade'])"
          # SSRF protection must refuse internal targets
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/api/scan?target=169.254.169.254")
          test "$code" = "403"
