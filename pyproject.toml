[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safescope"
dynamic = ["version"]
description = "Safe, non-intrusive web security posture scanner: HTTPS, TLS, security headers, cookies and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karim" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["security", "scanner", "http-headers", "tls", "hsts", "csp", "devsecops", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "mypy>=1.5", "ruff>=0.4"]

[project.scripts]
safescope = "safescope.cli:main"

[project.urls]
Homepage = "https://github.com/Karim-Bazooka/SafeScope"
Issues = "https://github.com/Karim-Bazooka/SafeScope/issues"
Changelog = "https://github.com/Karim-Bazooka/SafeScope/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "safescope._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safescope = ["py.typed", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: tests that reach the public internet (run with --run-network)"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/safescope"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
